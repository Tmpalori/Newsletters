# ─── Uptime check ───────────────────────────────────────────────────────────
# Asks for every 5 minutes, but GitHub's cron is best-effort: on this repo
# scheduled runs land every 3 to 9 hours (63 hours in Oct 2026 saw 13 runs),
# so this is a backup, not the real-time check. That is an external monitor
# (UptimeRobot, Better Stack or similar) polling /api/health?deep=1 every
# few minutes and posting to the Slack alerts webhook, since it depends on
# neither GitHub's scheduler nor the Railway process. Each run checks the
# homepage, /api/health?deep=1 (server + database) and
# /events.json must answer fast, and the feed must have events. See
# scripts/uptime_check.py. Alerts Slack (SLACK_ALERTS_WEBHOOK_URL, else
# SLACK_WEBHOOK_URL) and, with the NTFY_TOPIC secret, a phone push via the
# ntfy app: once when it goes down, hourly while down, once when it's back.
# Once a day (also best-effort) it flags a stale feed: nothing published for 8+ days.
# That's its own job and concurrency group: a group keeps only one pending
# run, so in the shared group a */5 run could replace the queued daily one.
# ─────────────────────────────────────────────────────────────────────────────
name: Uptime

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 15 * * *'   # stale-feed check, ~10 AM Central
  workflow_dispatch:
    inputs:
      town:
        description: 'Town slug (towns/<slug>/town.json); victoria is The Vic 361'
        required: false
        default: victoria

permissions:
  contents: read

# The town this run is for (MULTI_CITY_PLAN.md 3.1). Scheduled runs and a
# dispatch without the input are Victoria's; town.py reads TOWN.
env:
  TOWN: ${{ inputs.town || 'victoria' }}
  # Another town's Slack posts carry its [tag] (scripts/slack_notify.py;
  # vars.SLACK_TOWN_TAG, or its city when unset; Victoria's is its city).
  SLACK_TOWN_TAG: ${{ inputs.town && inputs.town != 'victoria' && vars.SLACK_TOWN_TAG || '' }}

jobs:
  check:
    if: github.event.schedule != '17 15 * * *'
    concurrency:
      group: uptime${{ inputs.town && inputs.town != 'victoria' && format('-{0}', inputs.town) || '' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # Cone mode: root files (town.py) plus these folders. towns/ holds
          # another town's town.json, which town.py reads at import.
          sparse-checkout: |
            scripts
            towns
      # Down/up state from the last run, so an outage alerts once (plus
      # hourly reminders), not every run.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .uptime
          key: ${{ inputs.town && inputs.town != 'victoria' && format('{0}-', inputs.town) || '' }}uptime-state-${{ github.run_id }}
          restore-keys: ${{ inputs.town && inputs.town != 'victoria' && format('{0}-', inputs.town) || '' }}uptime-state-
      - name: Check the live site
        env:
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          # The alert also goes to the owner inbox (scripts/slack_notify.py → server/opsReport.js).
          OPS_REPORT_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET || secrets.SUBMISSION_REVIEW_SECRET || secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p .uptime
          python3 scripts/uptime_check.py "$SITE" .uptime/state.json
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .uptime
          key: ${{ inputs.town && inputs.town != 'victoria' && format('{0}-', inputs.town) || '' }}uptime-state-${{ github.run_id }}

  stale-feed:
    if: github.event.schedule == '17 15 * * *'
    concurrency:
      group: uptime-stale-feed
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # Cone mode: root files (town.py) plus these folders. towns/ holds
          # another town's town.json, which town.py reads at import.
          sparse-checkout: |
            scripts
            towns
      - name: Stale feed
        env:
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          # The alert also goes to the owner inbox (scripts/slack_notify.py → server/opsReport.js).
          OPS_REPORT_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET || secrets.SUBMISSION_REVIEW_SECRET || secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
        run: |
          # A site that's down is the check job's alert, not a stale feed.
          curl -fsS --max-time 30 -o events.json "$SITE/events.json" ||
            { echo "::warning::Couldn't fetch events.json; skipping the stale-feed check."; exit 0; }
          age=$(python3 scripts/feed_age.py events.json 2>/dev/null || echo 99)
          if [ "$age" -ge 8 ]; then
            python3 scripts/slack_notify.py "⏰ No events published in $age days. Pick this week's events in admin." --link "$SITE/admin.html"
          fi
