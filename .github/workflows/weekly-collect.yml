# ─── The Vic 361 — Weekly Event Collection ───────────────────────────────────
# Runs Sunday and Wednesday afternoons to refresh candidates.json. This job
# publishes nothing itself: its commit redeploys Railway, and on boot the
# server auto-publishes the candidates into the `published_events` row
# (server/autopublish.js). docs/events.json in this repo is a curated
# fallback that admin Save & Publish (via GITHUB_TOKEN) is the only writer
# of, so the run uses --candidates-only and never stages that file
# (test_collect_events_safety.py checks both). See AGENTS.md.
#
# Schedule note (DST drift): GitHub Actions cron runs in UTC and does NOT
# observe US daylight-saving transitions. The fixed cron below means the
# job is scheduled for:
#   - 3:23 PM Central during CDT (Mar–Nov, UTC-5)
#   - 2:23 PM Central during CST (Nov–Mar, UTC-6)
# The 1-hour shift twice a year is intentional and acceptable. Do NOT
# silently "fix" the cron each DST switch.
# Why mid-afternoon and minute 23 (Oct 2026): GitHub queues scheduled runs
# at busy times, worst on the hour. The old 23:00 UTC (6 PM CDT) slot
# routinely started 45–90 minutes late, so the week's events showed up
# mid-evening. An off-the-hour afternoon slot lands well before evening
# even when delayed. server/sources.js mirrors this time for the admin.
# Also runs on manual trigger (workflow_dispatch).
#
# Google Maps venue discovery removed (Apr 2026): production runs showed
# `discover_venues.py` consuming ~4 minutes, hitting per-category Apify
# timeouts, skipping 5/8 categories, and still yielding HIGH=0 MEDIUM=0
# from 60 raw items — slow and low-quality. Venue curation now happens
# manually via venues.json. The script and its tests are kept in-tree as
# an opt-in utility (`python discover_venues.py`) but no longer run on
# the weekly cron. See PRs #42/#43 for the prior non-blocking attempts
# that this PR supersedes.
#
# Timeout budget (job-level 55 min, with per-step caps):
#   - Apify uses a 240s per-call timeout (OpenAI calls cap at 60s), and the
#     collector chains several of them; 55 minutes gives room for a couple
#     of those to time out without killing the whole run.
#   - Per-step timeouts cap each phase so a single hung dependency can't
#     swallow the entire budget — the failed step gets a clean "timed out"
#     annotation instead of the whole job being cancelled mid-write.
#   - PYTHONUNBUFFERED=1 + `python -u` flush stdout line-by-line so that if
#     a step does stall, the workflow log shows where it got stuck instead
#     of the silent gap we saw in run 25121385371.
#   - Step bumped 15 → 25 min after run 25127431431 (PR #45 follow-up):
#     with FB_POSTS_ENABLED + IG_POSTS_ENABLED both on, FB Posts (~6m) +
#     IG Posts (~7m) plus AI Review of ~110 events crowded the old 15-min
#     ceiling. The internal IG/FB venue caps (env-tunable
#     IG_POSTS_MAX_VENUES / FB_POSTS_MAX_VENUES) keep the scrape phase
#     bounded so the AI Review tail still fits under 25 min.
# ─────────────────────────────────────────────────────────────────────────────

name: Weekly Collect

on:
  schedule:
    # 20:23 UTC every Sunday. = 3:23 PM CDT (Mar–Nov) / 2:23 PM CST (Nov–Mar).
    # See header comment for the DST drift and why it's off the hour.
    - cron: '23 20 * * 0'
    # Midweek refresh (Wednesday, same time) so events announced after
    # Sunday still make the site. Added alongside, not instead of, the
    # Sunday cron above. Each run's candidates.json redeploys the site,
    # which auto-publishes them (server/autopublish.js).
    - cron: '23 20 * * 3'
  workflow_dispatch:       # Manual trigger from GitHub UI
    inputs:
      town:
        description: 'Town slug (towns/<slug>/town.json); victoria is The Vic 361'
        required: false
        default: victoria

permissions:
  contents: write          # Needed to push updated candidates.json

jobs:
  # Which towns this run collects (MULTI_CITY_PLAN.md 3.4). A scheduled run
  # covers Victoria plus every town whose town.json has "workflows": true
  # (set with its GitHub Environment, 3.3); a manual run, the one town asked
  # for. If this lookup fails, Victoria still collects.
  towns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      list: ${{ steps.t.outputs.list }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Cone mode: root files (town.py) plus towns/.
          sparse-checkout: |
            towns
      - id: t
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TOWN: ${{ inputs.town || 'victoria' }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            list=$(python3 town.py scheduled) || list='["victoria"]'
          else
            list=$(python3 -c 'import json,sys; print(json.dumps([sys.argv[1]]))' "$INPUT_TOWN")
          fi
          echo "Towns: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  collect:
    name: collect ${{ matrix.town }}
    needs: towns
    strategy:
      # One town failing must not cancel another's collect (Victoria's above all).
      fail-fast: false
      matrix:
        town: ${{ fromJSON(needs.towns.outputs.list) }}
    # A manual run and the schedule must not collect (and push) the same
    # town at once. Victoria's group keeps its old name.
    concurrency:
      group: weekly-collect${{ matrix.town != 'victoria' && format('-{0}', matrix.town) || '' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Per-step timeouts below keep any single phase bounded; this is the
    # overall safety net — see header comment.
    timeout-minutes: 55
    env:
      # The town this job is for (MULTI_CITY_PLAN.md 3.1); town.py reads TOWN.
      TOWN: ${{ matrix.town }}
      # Another town's Slack posts carry its [tag] (scripts/slack_notify.py;
      # vars.SLACK_TOWN_TAG, or its city when unset; Victoria's is its city).
      SLACK_TOWN_TAG: ${{ matrix.town != 'victoria' && vars.SLACK_TOWN_TAG || '' }}
      # Force line-buffered stdout for every Python step so progress logs
      # appear in real time. The Apr-29 cancellation showed nothing between
      # collector start and kill — that was buffering, not a true hang in
      # the early scrapers.
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Town paths
        # TOWN unset is Victoria: its files at the repo root and in docs/.
        # Another town's live under towns/<slug>/ (town.py town_paths).
        run: python3 town.py paths >> "$GITHUB_ENV"

      - name: Run event collector
        # Step-level timeout: collector chains several scrapers (city
        # calendar, library, theatre victoria, allevents, Apify FB events,
        # optionally FB/IG posts → OpenAI extraction, OpenAI AI review).
        # Each remote call has its own 240s ceiling. 25 min lets FB Posts +
        # IG Posts + AI Review of ~100 events all complete in a real run
        # while still capping a stuck step so the workflow fails loudly
        # instead of being silently cancelled at the job-level timeout.
        # Bumped 15 → 25 after run 25127431431 (PR #45 IG seed) timed out
        # in AI Review with 111 events. Internal venue caps below keep the
        # scrape phase bounded so this tail fits.
        # 35 → 50 (Oct 2026): with Gemini search added, the Oct 4 run's
        # collector step took 33 minutes, too close to the old cap.
        timeout-minutes: 50
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          # Optional repo variable to swap the OpenAI model without a code
          # change (collector default: gpt-5-mini).
          OPENAI_MODEL:       ${{ vars.OPENAI_MODEL }}
          APIFY_TOKEN:        ${{ secrets.APIFY_TOKEN }}
          # Gemini + Google Search event discovery (optional; off without it).
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:       ${{ vars.GEMINI_MODEL }}
          # Toggle the FB-posts → OpenAI pipeline. Off until the Apify monthly
          # cap resets and we've verified post-volume cost. Set repository
          # variable FB_POSTS_ENABLED=1 (Settings → Variables → Actions) to
          # turn on without editing this file.
          FB_POSTS_ENABLED:   ${{ vars.FB_POSTS_ENABLED }}
          # Toggle the IG-posts → OpenAI pipeline (mirrors FB_POSTS_ENABLED).
          # Off until production-validated. Set repository variable
          # IG_POSTS_ENABLED=1 (Settings → Variables → Actions) to enable.
          IG_POSTS_ENABLED:   ${{ vars.IG_POSTS_ENABLED }}
          # Tuning knobs documented in AGENTS.md, set as repository
          # variables. Unset reaches the collector as "", which it treats
          # as the default.
          FB_POSTS_MAX_VENUES:   ${{ vars.FB_POSTS_MAX_VENUES }}
          IG_POSTS_MAX_VENUES:   ${{ vars.IG_POSTS_MAX_VENUES }}
          GEMINI_ENABLED:        ${{ vars.GEMINI_ENABLED }}
          ENRICH_ENABLED:        ${{ vars.ENRICH_ENABLED }}
          FLYER_IMAGES:          ${{ vars.FLYER_IMAGES }}
          EVENTBRITE_ENABLED:    ${{ vars.EVENTBRITE_ENABLED }}
          EVENTBRITE_MAX:        ${{ vars.EVENTBRITE_MAX }}
          FB_EVENTS_ALT_ENABLED: ${{ vars.FB_EVENTS_ALT_ENABLED }}
          FB_EVENTS_MAX:         ${{ vars.FB_EVENTS_MAX }}
        run: |
          # --candidates-only: write candidates.json but DO NOT overwrite
          # docs/events.json. The curated fallback at docs/events.json is
          # owned exclusively by the admin Save & Publish flow.
          # `python -u` is belt-and-braces with PYTHONUNBUFFERED at the
          # job env — leaves no room for a buffered-stdout regression to
          # hide a future stall.
          python -u collect_events.py \
            --output "./$TOWN_EVENTS" \
            --candidates "./$TOWN_CANDIDATES" \
            --local-dir "$TOWN_DIR" \
            --days 14 \
            --candidates-only

      - name: Check for changes
        id: changes
        run: |
          # Note: docs/events.json is intentionally NOT in this list — the
          # weekly job runs in --candidates-only mode and must never commit
          # changes to the curated fallback.
          # collection_metadata.json is included so the admin Sources tab on
          # Railway can read per-source pull counts/timestamps after each run.
          # venues.json / pending_venues.json / facebook_venues.backup.json
          # are no longer touched here — Google Maps discovery was removed
          # (see header comment) and the collector only reads venue files.
          # enrichment_cache.json: gap-filling lookups (collect_events.py
          # enrich_thin_events), kept so each event is searched once.
          # status, not diff: a new town's first files are untracked, which diff calls unchanged.
          if [ -z "$(git status --porcelain -- "$TOWN_CANDIDATES" "$TOWN_COLLECTION_METADATA" "$TOWN_ENRICHMENT_CACHE")" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "The Vic 361 Bot"
          git config user.email "bot@thevic361.com"
          # docs/events.json is deliberately omitted: it's the curated
          # fallback and only the admin Save & Publish flow (running with
          # GITHUB_TOKEN) is allowed to commit to it.
          git add "$TOWN_CANDIDATES"
          # collection_metadata.json is the admin Sources-tab feed (per-source
          # counts + timestamps). Add it only if the collector wrote one.
          [ -f "$TOWN_COLLECTION_METADATA" ] && git add "$TOWN_COLLECTION_METADATA"
          [ -f "$TOWN_ENRICHMENT_CACHE" ] && git add "$TOWN_ENRICHMENT_CACHE"
          git commit -m "🏙️ Update candidates $(date +'%Y-%m-%d')"
          # main can move during the ~25 min collect (a merge, the social
          # kit's commit). Rebase and retry instead of losing this run.
          # -X theirs keeps this run's freshly generated files if a merge
          # touched them meanwhile (in a rebase "theirs" is the commit being
          # replayed). A failed rebase is aborted before the next try, or
          # every retry dies on "rebase in progress" and the paid collect is
          # lost.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1

      - name: Tell Slack the candidates are ready
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ACTIVITY_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          SLACK_ALERTS_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Next 14 days only: hand-added events run 90 days ahead.
          n=$(python3 -c "import json,os,datetime as d;e=json.load(open(os.environ['TOWN_CANDIDATES']));e=e.get('events',e) if isinstance(e,dict) else e;end=(d.date.today()+d.timedelta(days=14)).isoformat();print(sum(1 for x in e if x.get('date','')<=end))" 2>/dev/null || echo "?")
          # The collector's warnings (a source that crashed or came back
          # empty, an expired token): count + first few, so a broken source
          # doesn't go unnoticed on a green run. Escaped for Slack.
          w=$(python3 -c "import json,os;m=json.load(open(os.environ['TOWN_COLLECTION_METADATA']));print((m.get('warnings') or {}).get('summary','').replace('&','&amp;').replace('<','&lt;').replace('>','&gt;'))" 2>/dev/null || true)
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 scripts/slack_notify.py "🗓️ Collect done: $n events in the next two weeks. They'll publish automatically in a minute; edit or remove any in admin.${w:+ ⚠️ $w}" --link "${{ vars.SITE_URL || 'https://www.thevic361.com' }}/admin.html"
          if [ -n "$w" ] && [ "$SLACK_ALERTS_URL" != "$SLACK_WEBHOOK_URL" ]; then
            SLACK_WEBHOOK_URL="$SLACK_ALERTS_URL" python3 scripts/slack_notify.py "⚠️ Weekly collect: $w" --link "$run_url"
          fi

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/slack_notify.py "🚨 Weekly event collect failed" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
