# Social Kit — builds this week's / this weekend's slides and captions from
# the live published events and commits them to docs/social/latest/, which
# is served at https://www.thevic361.com/social/latest/ (noindex).
#
# Runs every morning at 8:47 AM Central: the site's scheduler
# (server/scheduler.js) dispatches it with scheduled=true, because GitHub's
# own cron runs hours late. The 13:47 (CDT) / 14:47 (CST) UTC crons stay as a fallback and
# skips itself when the site already dispatched today's run (posted.json
# also stops a second post). Either way the run is "scheduled": Monday
# rebuilds the week, weekend and today kits; Thursday the weekend (plus its
# Reel) and today; other days only today, so the repo isn't rewriting the
# week's slides daily. It also rebuilds everything when the generator changes.
#
# Auto-posting to Facebook + Instagram (scripts/social_post.py) runs on the
# schedule only when the SOCIAL_AUTOPOST repo variable is 1 and the
# META_PAGE_ID / META_PAGE_TOKEN (+ optional IG_USER_ID) secrets are set.
# Monday posts "this week", Thursday "this weekend" (plus "today" when
# Thursday has a Vic's Pick), other days "today".
# Monday also sends Slack a short list of this week's taggable venues
# (outreach-slack.txt; the full list is outreach.txt) so
# they can be sent their link to reshare.

name: Social Kit

on:
  schedule:
    - cron: '47 13 * * *'   # CDT slot (fallback; the gate keeps the one matching DST)
    - cron: '47 14 * * *'   # CST slot
  push:
    branches: [main]
    paths:
      - scripts/social_kit.py
      - scripts/social_slides.py
      - scripts/social_post.py
      - docs/icons.svg
      - docs/logo-512.png
      - docs/skyline.svg
      - .github/workflows/social-kit.yml
  workflow_dispatch:
    inputs:
      town:
        description: 'Town slug (towns/<slug>/town.json); victoria is The Vic 361'
        required: false
        default: victoria
      post:
        description: 'Also post to Facebook/Instagram'
        type: boolean
        default: false
      kind:
        description: 'Which kit to post'
        type: choice
        options: [weekend, week, today]
        default: weekend
      scheduled:
        description: 'The daily run (set by the site scheduler): build and post like the schedule'
        type: boolean
        default: false

permissions:
  contents: write

# A group holds one running and one pending run, and a newer run replaces
# the pending one, so a push rebuild could drop a queued scheduled post.
# Posting runs (schedule, the site scheduler's dispatch with scheduled, or
# by hand with post) get their own group; two of them still never overlap,
# so nothing posts twice.
concurrency:
  group: social-kit-${{ (github.event_name == 'schedule' || inputs.post || inputs.scheduled) && 'post' || 'build' }}${{ inputs.town && inputs.town != 'victoria' && format('-{0}', inputs.town) || '' }}
  cancel-in-progress: false

# The town this run is for (MULTI_CITY_PLAN.md 3.1). Scheduled runs and a
# dispatch without the input are Victoria's; town.py reads TOWN.
env:
  TOWN: ${{ inputs.town || 'victoria' }}
  # Another town's Slack posts carry its [tag] (scripts/slack_notify.py;
  # vars.SLACK_TOWN_TAG, or its city when unset; Victoria's is its city).
  SLACK_TOWN_TAG: ${{ inputs.town && inputs.town != 'victoria' && vars.SLACK_TOWN_TAG || '' }}

jobs:
  # A late GitHub cron run is skipped when the site's scheduler already
  # started today's run.
  gate:
    # The town's GitHub Environment (its SITE_URL, cron secrets, Meta ids);
    # none for Victoria, which keeps the repo-level settings.
    environment: ${{ inputs.town && inputs.town != 'victoria' && inputs.town || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          CDT_CRON: '47 13 * * *'
          CST_CRON: '47 14 * * *'
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            # GitHub's cron is UTC, so the slot is listed at its CDT and its
            # CST time and only the one matching Central's offset today
            # counts. One cron pinned to CDT fires an hour early all winter,
            # when /api/scheduler/ran still answers for yesterday's slot.
            if [ "$(TZ=America/Chicago date -d "${GATE_NOW:-now}" +%z)" = "-0500" ]; then want="$CDT_CRON"; else want="$CST_CRON"; fi
            if [ "$SCHEDULE" != "$want" ]; then
              echo "This is the other DST's cron ($SCHEDULE); the $want run covers today."; run=false
            elif curl -fsS --max-time 20 "$SITE/api/scheduler/ran?job=social-kit" | grep -q '"ran":true'; then
              echo "The site's scheduler already ran today's kit; skipping this late cron run."; run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # The town's GitHub Environment (its SITE_URL, cron secrets, Meta ids);
    # none for Victoria, which keeps the repo-level settings.
    environment: ${{ inputs.town && inputs.town != 'victoria' && inputs.town || '' }}
    runs-on: ubuntu-latest
    # Worst case: build, up to 10 min waiting for the deploy, a Reel that
    # takes 6 min to process, and Thursday's second post. The post step has
    # its own limit, so a slow post still leaves time to save posted.json.
    timeout-minutes: 35
    steps:
      # Always the latest main, not the commit that triggered the run: a
      # re-run must see the kit and posted.json an earlier attempt pushed,
      # or it rebuilds over them (push conflict) and can post twice.
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pillow requests
      - name: Pick the kits
        id: kinds
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled }}
        run: |
          DOW="$(TZ=America/Chicago date +%u)"
          if [ "$SCHEDULED" != "true" ] || [ "$DOW" = "1" ]; then KINDS=week,weekend,today
          elif [ "$DOW" = "4" ]; then KINDS=weekend,today
          else KINDS=today; fi
          echo "kinds=$KINDS" >> "$GITHUB_OUTPUT"
      # The weekend Reel is stitched with ffmpeg, which runner images don't
      # always include. Only the weekend kit makes a Reel, so a daily "today"
      # run skips apt entirely (one slow mirror took 12 minutes, run
      # 37496281450). Bounded and allowed to fail: without ffmpeg
      # social_kit.py falls back to the carousel.
      - name: Install ffmpeg
        if: contains(steps.kinds.outputs.kinds, 'weekend')
        timeout-minutes: 4
        continue-on-error: true
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Town paths
        # TOWN unset is Victoria: its kit in docs/social/latest/. Another
        # town's is in towns/<slug>/public/social/latest/ (town.py town_paths).
        run: python3 town.py paths >> "$GITHUB_ENV"
      - name: Build kit
        id: build
        env:
          PYTHONUNBUFFERED: 1
          KINDS: ${{ steps.kinds.outputs.kinds }}
        run: python scripts/social_kit.py --kinds "$KINDS"
      - name: Commit
        env:
          POSTING: ${{ github.event_name == 'schedule' || inputs.post || inputs.scheduled }}
        run: |
          git config user.name "The Vic 361 Bot"
          git config user.email "bot@thevic361.com"
          git add "$TOWN_SOCIAL"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "📣 Social kit $(date +'%Y-%m-%d')"
          # main may have moved while the kit built (weekly collect, a merge,
          # or a push rebuild and a posting run, which sit in different
          # concurrency groups, both committing docs/social/latest). A
          # posting run keeps its own kit on a conflict (-X theirs is the
          # commit being replayed), since that's what it is about to post; a
          # rebuild that conflicts yields to the kit already on main.
          for i in 1 2 3; do
            if [ "$POSTING" = "true" ]; then
              git pull --rebase -X theirs origin main && git push && exit 0
            elif git pull --rebase origin main; then
              git push && exit 0
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
              echo "::notice::A newer kit landed on main meanwhile; keeping it."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
      - name: Post to Facebook + Instagram
        id: post
        timeout-minutes: 22
        if: >-
          ((github.event_name == 'schedule' || inputs.scheduled) && vars.SOCIAL_AUTOPOST == '1') ||
          (github.event_name == 'workflow_dispatch' && !inputs.scheduled && inputs.post)
        env:
          PYTHONUNBUFFERED: 1
          # Repo variable, so a retired Graph version is a settings change;
          # the script's default (v23.0) applies when it's unset.
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v23.0' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # Another town's Meta settings count only when its Environment says
          # they're its own (town.py meta_allowed); Victoria's are repo-level.
          META_TOWN: ${{ vars.META_TOWN }}
          # A scheduled dispatch picks the kind by weekday, like the cron.
          DISPATCH_KIND: ${{ !inputs.scheduled && inputs.kind || '' }}
        run: |
          DOW="$(TZ=America/Chicago date +%u)"
          if [ -n "$DISPATCH_KIND" ]; then KIND="$DISPATCH_KIND"
          elif [ "$DOW" = "1" ]; then KIND=week
          elif [ "$DOW" = "4" ]; then KIND=weekend
          else KIND=today; fi
          rc=0
          python scripts/social_post.py --kind "$KIND" || rc=1
          # Vic's Picks are promised a social post. Thursday's post is the
          # weekend, so a pick for Thursday itself (often bought after
          # Monday's week post) gets the "today" post too, pick first.
          if [ -z "$DISPATCH_KIND" ] && [ "$DOW" = "4" ]; then
            python scripts/social_post.py --kind today --if-featured || rc=1
          fi
          exit $rc

      # Record what was posted (posted.json) even when one platform failed
      # or the post step was cancelled or timed out (social_post.py writes
      # it right after each post), so re-running the job doesn't post to the
      # other one twice.
      - name: Save posted ids
        if: always() && steps.post.outcome != 'skipped' && hashFiles(format('{0}posted.json', env.TOWN_SOCIAL)) != ''
        run: |
          git config user.name "The Vic 361 Bot"
          git config user.email "bot@thevic361.com"
          git add "${TOWN_SOCIAL}posted.json"
          git diff --cached --quiet && exit 0
          git commit -m "📣 Social posts $(date +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1

      - name: Send Slack this week's venues to tag
        # Only after this run's build: otherwise the file is last week's list.
        if: always() && steps.build.outcome == 'success' && (github.event_name == 'schedule' || inputs.scheduled) && hashFiles(format('{0}outreach-slack.txt', env.TOWN_SOCIAL)) != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ACTIVITY_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ "$(TZ=America/Chicago date +%u)" = "1" ] || exit 0
          [ -s "${TOWN_SOCIAL}outreach-slack.txt" ] || exit 0
          # Short version (scripts/social_kit.py outreach_slack); the full
          # list stays in outreach.txt, linked from the message.
          python3 scripts/slack_notify.py "$(cat "${TOWN_SOCIAL}outreach-slack.txt")"

      # cancelled() too: a run cut off by its timeout may have posted to
      # one platform and not the other.
      - name: Tell Slack it failed
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          # The alert also goes to the owner inbox (scripts/slack_notify.py → server/opsReport.js).
          OPS_REPORT_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET || secrets.SUBMISSION_REVIEW_SECRET || secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
          # Set by social_post.py when Meta refused the Graph version.
          ALERT: ${{ steps.post.outputs.alert }}
        run: python3 scripts/slack_notify.py "${ALERT:-🚨 Social kit (build or Facebook/Instagram post) failed}" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
