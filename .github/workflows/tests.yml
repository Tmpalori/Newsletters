# Tests — runs both suites on every PR and on pushes to main.
#
# Until this existed, PRs merged without anyone running the tests, and two
# admin tests had been failing on main unnoticed. Keep it fast: no network,
# no secrets, just `npm test` and `pytest`.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tell Slack main is broken
        if: failure() && github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          # The alert also goes to the owner inbox (scripts/slack_notify.py → server/opsReport.js).
          OPS_REPORT_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET || secrets.SUBMISSION_REVIEW_SECRET || secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
        run: python3 scripts/slack_notify.py "🚨 Website (Node) tests failing on main" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - name: Tell Slack main is broken
        if: failure() && github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          # The alert also goes to the owner inbox (scripts/slack_notify.py → server/opsReport.js).
          OPS_REPORT_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET || secrets.SUBMISSION_REVIEW_SECRET || secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
        run: python3 scripts/slack_notify.py "🚨 Collector (Python) tests failing on main" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
