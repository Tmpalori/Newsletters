# Newsletter — backup for the Monday and Thursday sends.
#
# The site sends both issues itself (server/scheduler.js): the weekly one
# Monday 7:43 AM Central and the weekend one Thursday 7:00 AM, because
# GitHub's cron runs hours late on this repo.
# This workflow calls the same send (/api/newsletter/cron, server/newsletter.js)
# as a fallback: a week that already went out is skipped, and a partly failed
# one resends only to the people who missed it, so running it is always safe.
#
# The on/off switch is the NEWSLETTER_AUTOSEND Railway variable (on unless
# it is 0); the scheduled run tells the site it's automatic, so it obeys
# that too. Run it by hand to send now regardless. Needs the
# NEWSLETTER_CRON_SECRET secret to match the Railway variable of the same
# name. A 5xx or no answer is tried up to 3 times about 4 minutes apart
# (safe: the send resumes and never mails anyone twice). Monday's call also sends last week's sponsor click reports.
# By hand, pick which issue to send.

name: Newsletter

on:
  schedule:
    - cron: '43 12 * * 1'   # Mon 7:43 AM CDT; usually runs hours late (fallback)
    - cron: '43 13 * * 1'   # Mon 7:43 AM CST
    - cron: '13 12 * * 4'   # Thu 7:13 AM CDT: the weekend issue (the site sends at 7:00)
    - cron: '13 13 * * 4'   # Thu 7:13 AM CST
  workflow_dispatch:
    inputs:
      town:
        description: 'Town slug (towns/<slug>/town.json); victoria is The Vic 361'
        required: false
        default: victoria
      edition:
        description: 'Which issue'
        type: choice
        options: [weekly, weekend]
        default: weekly

permissions:
  contents: read

# The town this run is for (MULTI_CITY_PLAN.md 3.1). Scheduled runs and a
# dispatch without the input are Victoria's; town.py reads TOWN.
env:
  TOWN: ${{ inputs.town || 'victoria' }}
  # Another town's Slack posts carry its [tag] (scripts/slack_notify.py;
  # vars.SLACK_TOWN_TAG, or its city when unset; Victoria's is its city).
  SLACK_TOWN_TAG: ${{ inputs.town && inputs.town != 'victoria' && vars.SLACK_TOWN_TAG || '' }}

jobs:
  # A cron at the other DST's time is skipped (pinned to CDT alone, the
  # winter run sent at 6:43 CST, before the 6:43 event check had hidden
  # anything), and so is a late run after the site already sent.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
      edition: ${{ steps.g.outputs.edition }}
    steps:
      # The send below calls the repo-level SITE_URL with the repo-level
      # NEWSLETTER_CRON_SECRET, which are Victoria's. Another town's run
      # would send Victoria's issue (a hand-run ignores its
      # NEWSLETTER_AUTOSEND=0) and nothing of its own, so it stops here until
      # that town has its GitHub Environment (MULTI_CITY_PLAN.md 3.3).
      - name: Only Victoria until per-town Environments
        env:
          RUN_TOWN: ${{ inputs.town || 'victoria' }}
        run: |
          if [ "$RUN_TOWN" != "victoria" ]; then
            echo "::error::Per-town newsletter dispatch needs its GitHub Environment (MULTI_CITY_PLAN.md 3.3). Not sending for '$RUN_TOWN': this workflow only reaches Victoria's site and secret. Send that town's issue from its own admin (Newsletter tab) instead."
            exit 1
          fi
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          INPUT_EDITION: ${{ inputs.edition }}
          CDT_CRON: '43 12 * * 1'
          CST_CRON: '43 13 * * 1'
          WEEKEND_CDT_CRON: '13 12 * * 4'
          WEEKEND_CST_CRON: '13 13 * * 4'
        run: |
          run=true
          edition="${INPUT_EDITION:-weekly}"
          job=newsletter
          # A Thursday cron is the weekend issue, with its own slot.
          case "$SCHEDULE" in "$WEEKEND_CDT_CRON"|"$WEEKEND_CST_CRON") edition=weekend ;; esac
          if [ "$edition" = "weekend" ]; then job=newsletter-weekend; CDT_CRON="$WEEKEND_CDT_CRON"; CST_CRON="$WEEKEND_CST_CRON"; fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "schedule" ]; then
            # GitHub's cron is UTC, so the slot is listed at its CDT and its
            # CST time and only the one matching Central's offset today
            # counts. One cron pinned to CDT fires an hour early all winter,
            # when /api/scheduler/ran still answers for yesterday's slot.
            if [ "$(TZ=America/Chicago date -d "${GATE_NOW:-now}" +%z)" = "-0500" ]; then want="$CDT_CRON"; else want="$CST_CRON"; fi
            if [ "$SCHEDULE" != "$want" ]; then
              echo "This is the other DST's cron ($SCHEDULE); the $want run covers today."; run=false
            elif curl -fsS --max-time 20 "$SITE/api/scheduler/ran?job=$job" | grep -q '"ran":true'; then
              echo "The site's scheduler already ran this $edition send; skipping this late cron run."; run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  send:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 3 tries of up to 5 minutes each, 4 minutes apart.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6   # for scripts/slack_notify.py
      - name: Send this week's newsletter
        env:
          SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
          EDITION: ${{ needs.gate.outputs.edition }}
        run: |
          if [ -z "$SECRET" ]; then echo "::error::NEWSLETTER_CRON_SECRET is not set"; exit 1; fi
          # A 5xx or no answer (Railway mid-restart, a Resend blip) is tried
          # again, up to 3 times about 4 minutes apart. That's safe:
          # sendWeekly (server/newsletter.js) answers already-sent for a sent
          # week, a partial send resumes with only the failed addresses, and
          # its per-week Resend idempotency keys stop a request that timed
          # out mid-send from mailing anyone twice. A 4xx (wrong secret)
          # won't fix itself, so it fails at once.
          for try in 1 2 3; do
            : > out.json
            code=$(curl -sS --max-time 300 -o out.json -w '%{http_code}' -X POST -H "X-Cron-Secret: $SECRET" -H "X-Cron-Scheduled: $SCHEDULED" -H "X-Newsletter-Edition: $EDITION" "$SITE/api/newsletter/cron") || true
            cat out.json; echo
            [ "$code" = "200" ] && exit 0
            case "$code" in 5*|000|"") ;; *) break ;; esac
            [ "$try" = 3 ] || { echo "HTTP $code; trying again in 4 minutes"; sleep 240; }
          done
          echo "::error::Newsletter send returned HTTP $code"; exit 1

      - name: Tell Slack it failed
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          # The alert also goes to the owner inbox (scripts/slack_notify.py → server/opsReport.js).
          OPS_REPORT_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET || secrets.SUBMISSION_REVIEW_SECRET || secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
        run: python3 scripts/slack_notify.py "🚨 ${{ needs.gate.outputs.edition == 'weekend' && 'Thursday weekend' || 'Monday' }} newsletter send failed" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
