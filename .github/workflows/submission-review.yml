# Submission review — the AI looks at new free event submissions
# (scripts/review_submissions.py → server/submissionReview.js): tidies the
# name, description and icons, publishes the good ones, turns away spam and
# church events, and leaves anything doubtful in the admin queue with a
# reason. One Slack message per run that decided something. Each run's
# pending fetch also sends any sponsor / Vic's Pick reports that are due
# (server/sponsors.js), so this is the site's 15-minute scheduler too.
#
# Needs SUBMISSION_REVIEW_SECRET (or EVENT_CHECK_SECRET / NEWSLETTER_CRON_SECRET)
# set the same in Railway and here, and OPENAI_API_KEY. Set the
# SUBMISSION_AUTOAPPROVE Railway variable to 0 to have it only flag.
#
# When: every 15 minutes. The site's scheduler (server/scheduler.js)
# dispatches it on time, because GitHub's own cron runs hours late; the
# cron below stays as a fallback. A repeat run is harmless: each submission
# is decided once, and the concurrency group runs them one at a time.
# Also by hand. The site being down or answering 5xx is only a warning
# (the run passes), so an outage doesn't add an alert every 15 minutes on
# top of the health and uptime alerts; a wrong secret still fails.

name: Submission Review

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      town:
        description: 'Town slug (towns/<slug>/town.json); victoria is The Vic 361'
        required: false
        default: victoria

permissions:
  contents: read

concurrency:
  group: submission-review${{ inputs.town && inputs.town != 'victoria' && format('-{0}', inputs.town) || '' }}
  cancel-in-progress: false

# The town this run is for (MULTI_CITY_PLAN.md 3.1). Scheduled runs and a
# dispatch without the input are Victoria's; town.py reads TOWN.
env:
  TOWN: ${{ inputs.town || 'victoria' }}
  # Another town's Slack posts carry its [tag] (scripts/slack_notify.py;
  # vars.SLACK_TOWN_TAG, or its city when unset; Victoria's is its city).
  SLACK_TOWN_TAG: ${{ inputs.town && inputs.town != 'victoria' && vars.SLACK_TOWN_TAG || '' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # When the AI review was last reported down, so a dead OpenAI key or
      # empty credit fails the run (and pings Slack) once every 6 hours,
      # not every 15 minutes (scripts/review_submissions.py ai_down_alert).
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .review-state
          key: ${{ inputs.town && inputs.town != 'victoria' && format('{0}-', inputs.town) || '' }}review-state-${{ github.run_id }}
          restore-keys: ${{ inputs.town && inputs.town != 'victoria' && format('{0}-', inputs.town) || '' }}review-state-

      - name: Review new submissions
        env:
          AI_ALERT_STATE: .review-state/ai-alert.json
          # Runs the AI couldn't answer for each submission; after a few it's
          # flagged for the owner instead of retried every 15 minutes.
          REVIEW_ATTEMPTS_STATE: .review-state/attempts.json
          SITE_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SUBMISSION_REVIEW_SECRET: ${{ secrets.SUBMISSION_REVIEW_SECRET || secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
        run: python3 scripts/review_submissions.py

      - name: Save state
        if: always() && hashFiles('.review-state/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .review-state
          key: ${{ inputs.town && inputs.town != 'victoria' && format('{0}-', inputs.town) || '' }}review-state-${{ github.run_id }}

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/slack_notify.py "🚨 Submission review failed" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
