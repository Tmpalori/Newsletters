# ─── The Vic 361 — Weekly Event Digest Email ────────────────────────────────
# Every Sunday at 9 PM Central (Monday 02:00 UTC during CDT), email Tristen an
# informational summary of what was collected earlier in the evening. He then
# uses the admin review workflow (/admin.html, landing in a follow-up PR) to
# pick events; the newsletter goes out Monday morning (and the weekend issue Thursday).
# ─────────────────────────────────────────────────────────────────────────────

name: Weekly Digest

on:
  schedule:
    - cron: '0 2 * * 1'    # 9:00 PM Central, Sunday (Monday 02:00 UTC during CDT)
  workflow_dispatch:        # Manual trigger from GitHub UI
    inputs:
      town:
        description: 'Town slug (towns/<slug>/town.json); victoria is The Vic 361'
        required: false
        default: victoria

permissions:
  contents: read

# The town this run is for (MULTI_CITY_PLAN.md 3.1). Scheduled runs and a
# dispatch without the input are Victoria's; town.py reads TOWN.
env:
  TOWN: ${{ inputs.town || 'victoria' }}
  # Another town's Slack posts carry its [tag] (scripts/slack_notify.py;
  # vars.SLACK_TOWN_TAG, or its city when unset; Victoria's is its city).
  SLACK_TOWN_TAG: ${{ inputs.town && inputs.town != 'victoria' && vars.SLACK_TOWN_TAG || '' }}

jobs:
  digest:
    # The town's GitHub Environment (its SITE_URL, cron secrets, Meta ids);
    # none for Victoria, which keeps the repo-level settings.
    environment: ${{ inputs.town && inputs.town != 'victoria' && inputs.town || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Town paths
        # TOWN unset is Victoria: its files at the repo root and in docs/.
        # Another town's live under towns/<slug>/ (town.py town_paths).
        run: python3 town.py paths >> "$GITHUB_ENV"

      - name: Send digest email
        env:
          SMTP_EMAIL:    ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST:     smtp.gmail.com
          SMTP_PORT:     '587'
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
        run: |
          # A town whose jobs run on Railway (JOBS_ON_RAILWAY.md) no longer
          # commits its candidates here: read its live list from the site.
          src="./$TOWN_CANDIDATES"
          if curl -fsS --max-time 20 "$SITE/api/config" | grep -q '"jobs_on_railway":true'; then
            curl -fsS --max-time 60 -o live-events.json "$SITE/events.json?all=1"
            src=./live-events.json
          fi
          python send_digest.py \
            --candidates "$src" \
            --to tristen.m.palori@gmail.com \
            --all-days

      - name: Tell Slack it failed
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          # The alert also goes to the owner inbox (scripts/slack_notify.py → server/opsReport.js).
          OPS_REPORT_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET || secrets.SUBMISSION_REVIEW_SECRET || secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
        run: python3 scripts/slack_notify.py "🚨 Weekly digest email failed" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
