# Meta ads — read and manage The Vic 361's ads (scripts/meta_ads.py).
#
# Daily: yesterday's and the last 7 days' results to Slack (activity
# channel); quiet when nothing has spent and no ad is on; an ad that started today reports today's spend; $0 spent with
# an ad on, a rejected ad or a disabled account is reported. A dead token
# or lost account access fails the run and alerts Slack. By hand (Actions → Meta Ads →
# Run workflow, or `gh workflow run meta-ads.yml -f command=status`):
# status, pause/resume an id, or set a daily budget in dollars (over $50
# needs force). Results show in the run summary.
#
# When: the site's scheduler (server/scheduler.js) dispatches the daily
# report at 8:37 AM Central with scheduled=true, because GitHub's own cron
# runs hours late. The cron below stays as a fallback and skips itself when
# the site already dispatched today's run.
#
# Token: META_ADS_TOKEN (system user with ads_read + ads_management and the
# ad account assigned), else META_PAGE_TOKEN. Optional repo variable
# META_AD_ACCOUNT_ID when the token sees more than one ad account.

name: Meta Ads

on:
  schedule:
    - cron: '37 13 * * *'   # CDT slot (fallback; the gate keeps the one matching DST)
    - cron: '37 14 * * *'   # CST slot
  workflow_dispatch:
    inputs:
      town:
        description: 'Town slug (towns/<slug>/town.json); victoria is The Vic 361'
        required: false
        default: victoria
      command:
        description: 'What to do'
        type: choice
        options: [status, report, pause, resume, budget]
        default: status
      target:
        description: 'Campaign, ad set or ad id (pause/resume/budget)'
        required: false
        default: ''
      amount:
        description: 'Daily budget in dollars (budget)'
        required: false
        default: ''
      force:
        description: 'Allow a budget over $50/day'
        type: boolean
        default: false
      scheduled:
        description: 'The daily report (set by the site scheduler)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: meta-ads${{ inputs.town && inputs.town != 'victoria' && format('-{0}', inputs.town) || '' }}
  cancel-in-progress: false

# The town this run is for (MULTI_CITY_PLAN.md 3.1). Scheduled runs and a
# dispatch without the input are Victoria's; town.py reads TOWN.
env:
  TOWN: ${{ inputs.town || 'victoria' }}
  # Another town's Slack posts carry its [tag] (scripts/slack_notify.py;
  # vars.SLACK_TOWN_TAG, or its city when unset; Victoria's is its city).
  SLACK_TOWN_TAG: ${{ inputs.town && inputs.town != 'victoria' && vars.SLACK_TOWN_TAG || '' }}

jobs:
  # A late GitHub cron run is skipped when the site's scheduler already
  # dispatched today's report (no second Slack report).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          CDT_CRON: '37 13 * * *'
          CST_CRON: '37 14 * * *'
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            # GitHub's cron is UTC, so the slot is listed at its CDT and its
            # CST time and only the one matching Central's offset today
            # counts. One cron pinned to CDT fires an hour early all winter,
            # when /api/scheduler/ran still answers for yesterday's slot.
            if [ "$(TZ=America/Chicago date -d "${GATE_NOW:-now}" +%z)" = "-0500" ]; then want="$CDT_CRON"; else want="$CST_CRON"; fi
            if [ "$SCHEDULE" != "$want" ]; then
              echo "This is the other DST's cron ($SCHEDULE); the $want run covers today."; run=false
            elif curl -fsS --max-time 20 "$SITE/api/scheduler/ran?job=meta-ads" | grep -q '"ran":true'; then
              echo "The site's scheduler already ran today's report; skipping this late cron run."; run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  ads:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Meta ads
        id: ads
        env:
          # Repo variable, so a retired API version is a settings change;
          # the script's default (v23.0) applies when it's unset.
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v23.0' }}
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN || secrets.META_PAGE_TOKEN }}
          META_ADS_TOKEN_SOURCE: ${{ secrets.META_ADS_TOKEN && 'ads' || 'page' }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID }}
          # The daily report sends each day's spend to the site (Admin →
          # Growth): Railway's ADS_SPEND_SECRET, else the submission review
          # secret it falls back to.
          ADS_SPEND_SECRET: ${{ secrets.ADS_SPEND_SECRET || secrets.SUBMISSION_REVIEW_SECRET || secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ACTIVITY_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMAND: ${{ (github.event_name == 'schedule' || inputs.scheduled) && 'report' || inputs.command }}
          TARGET: ${{ inputs.target }}
          AMOUNT: ${{ inputs.amount }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.scheduled) && '--scheduled' || '' }}
        run: python3 scripts/meta_ads.py "$COMMAND" "$TARGET" "$AMOUNT" $FORCE $SCHEDULED

      - name: Tell Slack it failed
        if: (failure() || cancelled()) && (github.event_name == 'schedule' || inputs.scheduled)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          # The alert also goes to the owner inbox (scripts/slack_notify.py → server/opsReport.js).
          OPS_REPORT_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET || secrets.SUBMISSION_REVIEW_SECRET || secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
          # Set by meta_ads.py when Meta refused the API version, so the
          # alert names the version instead of blaming the token.
          ALERT: ${{ steps.ads.outputs.alert }}
        run: python3 scripts/slack_notify.py "${ALERT:-🚨 Meta ads daily check failed (token or ad account access?)}" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
