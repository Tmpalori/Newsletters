# ─── The Tide 757 — Local Events (Virginia Beach, VA) ───────────────────────
# Manually curated recurring and one-time events for Virginia Beach:
# neighborhoods first (the ViBe, Town Center, Shore Drive, Hilltop,
# Sandbridge, Pungo), the Oceanfront when locals actually go.
#
# RECURRING events auto-generate for each matching day of the week.
#   day: "friday" / "fri & sat" / [friday, saturday] all work.
#   start_date / end_date (YYYY-MM-DD) bound a seasonal run.
#   There is no "2nd Tuesday" rule: monthly events go under ONE-TIME
#   events below, one entry per date.
# ONE-TIME events only show on their specific date.
#
# The town feeds already pull the ViBe Creative District (First Fridays,
# VB Flea Market, Old Beach Art & Eco Market, International Night Markets,
# CreativeMornings, walking tours), Beach Events VB (the
# city's Oceanfront events: Holiday Trail of Lights, Holiday Parade at the
# Beach, Santa's Seaside Cinema, Last Night on the Town), the Neptune
# Festival, the Military Aviation Museum, Wasserhund Brewing (Virginia
# Beach location: trivia, music bingo, live music) and the Virginia Beach
# Public Library (LibraryCalendar iCal). Entries here cover what those
# miss: brewery and Shore Drive nights, farmers markets, Town Center (CBDA)
# events, the Sandler Center (carbonhouse site, no feed), Elevation 27
# (Ticketmaster widget, no feed), the Aquarium, and the big holiday dates.
# The feed's "Old Beach Farmers Market" is excluded (it lists every
# Saturday all winter); the market's own schedule is below. Virginia MOCA
# is here by hand: virginiamoca.org answers Railway's servers with a bot
# check (HTTP 202 and a challenge page), so its feed was dropped. Its
# public programs through January are at the end; its Facebook page
# (venues.json) covers the rest.
#
# Optional tags (they feed the event score; see server/scoring.js):
#   big: true        a big draw; shows in "Coming up" and scores high
#   favorite: true   a well-known weekly staple; keeps its spot on busy days
#
# Every entry carries a "# VERIFIED: <source> <date>" line.
#   "Sandler events page" = sandlercenter.org/events list view, read 2026-10-15.
#   "Elevation 27 homepage" = elevation27.com "Upcoming Shows", read 2026-10-15.
#   "CBDA events page" = cbda.net/events, read 2026-10-15.
#   "Aquarium featured events" = virginiaaquarium.com/featured-events, read 2026-10-15.
# ─────────────────────────────────────────────────────────────────────────────

