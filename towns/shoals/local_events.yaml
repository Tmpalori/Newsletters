# ─── Shoals Setlist — Local Events (Florence, Muscle Shoals, Sheffield, Tuscumbia, AL) ───
# Manually curated recurring and one-time events for the Shoals
# (Lauderdale and Colbert counties).
#
# RECURRING events auto-generate for each matching day of the week.
#   day: "friday" / "fri & sat" / [friday, saturday] all work.
#   start_date / end_date (YYYY-MM-DD) bound a seasonal run.
#   There is no "2nd Tuesday" rule: monthly events go under ONE-TIME
#   events below, one entry per date.
# ONE-TIME events only show on their specific date.
#
# The town feeds already pull the Shoals Chamber (GrowthZone), The Shoals
# Now and Florence Arts & Museums (Squarespace), MSNHA, TVAA/Ritz, UNA
# events, UNA athletics and the Florence-Lauderdale library calendars, and
# the collector dedups. So entries here are the backbone the feeds miss:
# the bar-and-restaurant live music that makes the Shoals the Shoals, plus
# big one-time dates we want to plan ahead for. Shoals After Dark (Mobile
# Plaza, Saturdays), the Ritz/TVAA season, UNA recitals and home games,
# Walker Ranch and the library programs come through the feeds.
#
# Optional tags (they feed the event score; see server/scoring.js):
#   big: true        a big draw; shows in "Coming up" and scores high
#   favorite: true   a well-known weekly staple; keeps its spot on busy days
#   town: "Rogersville"  a nearby-town event (only big ones belong here)
# Each day shows its best 15 events Mon–Thu and 20 Fri–Sun.
#
# Every entry carries a "# VERIFIED: <source> <date>" line. "Visit Florence
# live-music page" = visitflorenceal.com/music/live-music/, the CVB's weekly
# who's-playing-where lineup, read 2026-10-15 (it showed Wed Oct 14 – Wed
# Oct 21 2026). That page is also a feed (visit_florence_music), which names
# each night's act for the coming week; these weekly nights are named
# generically ("Live Music") so the collector merges them into that act
# when both list the same venue and start, and they fill the weeks after.
# ─────────────────────────────────────────────────────────────────────────────

