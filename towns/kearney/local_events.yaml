# ─── The Crane 308 — Local Events (Kearney, NE) ─────────────────────────────
# This file contains manually curated events and recurring events for
# Kearney and Buffalo County.
#
# RECURRING events auto-generate for each matching day of the week.
#   day: "friday" / "fri & sat" / [friday, saturday] all work.
#   start_date / end_date (YYYY-MM-DD) bound a seasonal run.
#   There is no "2nd Tuesday" rule: monthly events go under ONE-TIME
#   events below, one entry per date.
# ONE-TIME events only show on their specific date.
#
# Keep recurring events to genuinely interesting "things to do" —
# not daily restaurant specials or repeated toddler sessions.
#
# The town feed already pulls visitkearney.org and mona.unk.edu, and the
# collector dedups, so entries here are the backbone: weekly staples that
# must never drop off, plus big one-time dates we want to plan ahead for.
#
# Optional tags (they feed the event score; see server/scoring.js):
#   big: true        a big draw; shows in "Coming up" and scores high
#   favorite: true   a well-known weekly staple; keeps its spot on busy days
#   town: "Gibbon"   a nearby-town event (only big ones belong here)
# Each day shows its best 15 events Mon–Thu and 20 Fri–Sun.
#
# Every entry carries a "# VERIFIED: <source> <date>" line. "Visit Kearney
# calendar" = visitkearney.org's The Events Calendar listing (its REST feed),
# checked 2026-10-14, showing the series running into Nov 2026 – Jan 2027.
# ─────────────────────────────────────────────────────────────────────────────

