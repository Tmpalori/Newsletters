# ─── The Rogue 541 — Local Events (Medford & the Rogue Valley, OR) ──────────
# Manually curated events and recurring events for Medford, Ashland,
# Central Point, Jacksonville, Phoenix, Talent and Eagle Point.
#
# RECURRING events auto-generate for each matching day of the week.
#   day: "friday" / "fri & sat" / [friday, saturday] all work.
#   start_date / end_date (YYYY-MM-DD) bound a seasonal run.
#   There is no "2nd Tuesday" rule: monthly events go under ONE-TIME
#   events below, one entry per date.
# ONE-TIME events only show on their specific date.
#
# The town feeds already pull ashland.news, travelashland.com, craterian.org,
# events.sou.edu, the City of Ashland (events + recreation), Jackson County
# Library, the Jacksonville Review Google calendar, SOHS, RoxyAnn Winery,
# Grizzly Peak Winery, the Eagle Point Chamber and the Jackson County Expo.
# Entries here cover what those miss: Medford bars, comedy, markets, the
# Holly Theatre, Rogue X, and the big holiday dates. Travel Medford's
# 226-event calendar has no supported feed type yet, so its notable
# one-time items are copied here.
#
# Optional tags (they feed the event score; see server/scoring.js):
#   big: true        a big draw; shows in "Coming up" and scores high
#   favorite: true   a well-known weekly staple; keeps its spot on busy days
#
# Every entry carries a "# VERIFIED: <source> <date>" line.
#   "RV Times roundup" = rv-times.com "Things to Do in the Rogue Valley"
#     (Sept. 28-Oct. 12 and Oct. 12-26, 2026 editions), read 2026-10-15.
#   "Travel Medford calendar" = travelmedford.org/events agenda view
#     (Oct 15 2026 - Jan 31 2027), read 2026-10-15.
# ─────────────────────────────────────────────────────────────────────────────

