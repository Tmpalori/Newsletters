# ─── The Star 402 — Local Events (Lincoln, NE) ──────────────────────────────
# Manually curated events and recurring events for Lincoln and Lancaster
# County.
#
# RECURRING events auto-generate for each matching day of the week.
#   day: "friday" / "fri & sat" / [friday, saturday] all work.
#   start_date / end_date (YYYY-MM-DD) bound a seasonal run.
#   There is no "2nd Tuesday" rule: monthly events go under ONE-TIME
#   events below, one entry per date.
# ONE-TIME events only show on their specific date.
#
# Keep recurring events to genuinely interesting "things to do":
# not daily restaurant specials or repeated toddler sessions.
#
# The town feeds already pull events.unl.edu (Lied, Sheldon, Kimball, Husker
# soccer), the Zoo Bar and Crescent Moon calendars, Lincoln Stars, Nebraska
# Wesleyan, Francie & Finch and the Capitol, and the collector dedups, so
# entries here are the backbone: weekly staples that must never drop off,
# plus big one-time dates we want to plan ahead for (Husker home games and
# Pinnacle Bank Arena shows have no machine-readable feed).
#
# Optional tags (they feed the event score; see server/scoring.js):
#   big: true        a big draw; shows in "Coming up" and scores high
#   favorite: true   a well-known weekly staple; keeps its spot on busy days
#   town: "Raymond"  a nearby-town event (only big ones belong here)
# Each day shows its best 15 events Mon–Thu and 20 Fri–Sun.
#
# Every entry carries a "# VERIFIED: <source> <date>" line.
# Haymarket Farmers' Market ended its 2026 season Oct 10; add it back for
# May 2027 (Saturdays 8 AM - noon, 7th & P St).
# ─────────────────────────────────────────────────────────────────────────────

